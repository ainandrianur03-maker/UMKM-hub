<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - UMKM Starter Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo">
                <div style="font-size:3rem;margin-bottom:0.5rem;">🏪</div>
                <h2>UMKM Starter Hub</h2>
                <span>Login ke Admin Dashboard</span>
            </div>
            <div class="login-error" id="loginError">Username atau password salah!</div>
            <form onsubmit="doLogin(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" value="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" value="admin123" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;">Login</button>
            </form>
            <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;">
                <a href="index.html" style="color:var(--primary-600);">← Kembali ke Website</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        if (DB.get('auth')) window.location.href = 'admin/dashboard.html';
        function doLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin123') {
                DB.set('auth', { username: u, loggedIn: Date.now() });
                window.location.href = 'admin/dashboard.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginError').style.animation = 'fadeInUp 0.3s ease';
            }
        }
    </script>
</body>
</html>
